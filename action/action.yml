name: Control plane
description: Run a named action on the infra control plane and stream its log.
inputs:
  server:
    description: Control plane base URL
    required: true
  audience:
    description: OIDC audience the control plane expects (server.oidc_audience)
    required: true
  action:
    description: Catalog action name, e.g. network.plan
    required: true
  params:
    description: One key=value per line
    required: false
    default: ""
  ref:
    description: Git ref to run (defaults to the action's default ref)
    required: false
    default: ""
  input-job:
    description: Job id whose output this action reads (actions with input_from)
    required: false
    default: ""
outputs:
  job_id:
    description: Control plane job id
    value: ${{ steps.run.outputs.job_id }}
  status:
    description: Final job status
    value: ${{ steps.run.outputs.status }}
runs:
  using: composite
  steps:
    # A release tag downloads that release's cpctl; any other ref (main, a SHA, ./action) builds
    # it. A download that fails falls back to the build; a checksum that fails stops the step.
    - id: fetch
      name: Download cpctl
      shell: bash
      env:
        REPO: ${{ github.action_repository }}
        REF: ${{ github.action_ref }}
        OS: ${{ runner.os }}
        ARCH: ${{ runner.arch }}
      run: |
        case "$ARCH" in X64) arch=amd64 ;; ARM64) arch=arm64 ;; *) arch="" ;; esac
        if [[ "$OS" != Linux || -z "$arch" || -z "$REPO" || ! "$REF" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
          echo "No release binary for ref '${REF:-local}' on $OS/$ARCH; building cpctl."
          echo "downloaded=false" >> "$GITHUB_OUTPUT"
          exit 0
        fi
        base="$GITHUB_SERVER_URL/$REPO/releases/download/$REF"
        dir="$RUNNER_TEMP/cpctl-release"
        mkdir -p "$dir"
        if ! curl -fsSL --retry 3 -o "$dir/SHA256SUMS" "$base/SHA256SUMS" \
           || ! curl -fsSL --retry 3 -o "$dir/linux-$arch-cpctl" "$base/linux-$arch-cpctl"; then
          echo "::warning::Could not download cpctl from the $REF release; building it instead."
          echo "downloaded=false" >> "$GITHUB_OUTPUT"
          exit 0
        fi
        (cd "$dir" && grep " linux-$arch-cpctl\$" SHA256SUMS | sha256sum -c -)
        install -m 755 "$dir/linux-$arch-cpctl" "$RUNNER_TEMP/cpctl"
        [ "$("$RUNNER_TEMP/cpctl" version)" = "${REF#v}" ]
        echo "downloaded=true" >> "$GITHUB_OUTPUT"
    - if: steps.fetch.outputs.downloaded != 'true'
      uses: actions/setup-go@v5
      with:
        go-version-file: ${{ github.action_path }}/../go.mod
        cache: false
    - if: steps.fetch.outputs.downloaded != 'true'
      name: Build cpctl
      shell: bash
      working-directory: ${{ github.action_path }}/..
      run: go build -trimpath -o "$RUNNER_TEMP/cpctl" ./cmd/cpctl
    - id: run
      name: Run ${{ inputs.action }}
      shell: bash
      env:
        CONTROLPLANE_URL: ${{ inputs.server }}
        CONTROLPLANE_AUDIENCE: ${{ inputs.audience }}
        CP_ACTION: ${{ inputs.action }}
        CP_PARAMS: ${{ inputs.params }}
        CP_REF: ${{ inputs.ref }}
        CP_INPUT_JOB: ${{ inputs.input-job }}
      # Inputs travel via env, never interpolated into the script.
      run: |
        args=()
        while IFS= read -r line; do
          [[ -n "$line" ]] && args+=(-p "$line")
        done <<< "$CP_PARAMS"
        [[ -n "$CP_REF" ]] && args+=(-ref "$CP_REF")
        [[ -n "$CP_INPUT_JOB" ]] && args+=(-input-job "$CP_INPUT_JOB")
        "$RUNNER_TEMP/cpctl" run "${args[@]}" "$CP_ACTION"
