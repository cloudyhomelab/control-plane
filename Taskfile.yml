version: '3'

vars:
  CHANGIE: github.com/miniscruff/changie@v1.26.0

tasks:
  default:
    deps: [check]

  fmt:
    desc: Format all Go files in place
    silent: true
    cmds:
      - gofmt -w .

  fmt:check:
    desc: Fail if any Go file is not gofmt'ed
    silent: true
    cmds:
      - |
        unformatted=$(gofmt -l .)
        if [ -n "$unformatted" ]; then
          echo "Not gofmt'ed:"; echo "$unformatted"; exit 1
        fi

  build:
    desc: Build controlplane and cpctl for every release platform into bin/<os>-<arch>-<cmd>; VERSION=X.Y.Z stamps a release
    silent: true
    cmds:
      - for:
          matrix:
            OS: [linux]
            ARCH: [amd64, arm64]
        cmd: |
          for cmd in controlplane cpctl; do
            CGO_ENABLED=0 GOOS={{.ITEM.OS}} GOARCH={{.ITEM.ARCH}} go build -trimpath -ldflags="-s -X main.version={{.VERSION | default "dev"}}" -o bin/{{.ITEM.OS}}-{{.ITEM.ARCH}}-$cmd ./cmd/$cmd
          done

  clean:
    desc: Remove build output in bin/
    silent: true
    cmds:
      - rm -rf bin

  vet:
    desc: Report suspicious code (bad printf args, unreachable code, copied locks, ...) in all packages and tests
    silent: true
    cmds:
      - go vet ./...

  shellcheck:
    desc: Lint the shell scripts
    silent: true
    cmds:
      - shellcheck action/*.sh .githooks/commit-msg

  test:
    desc: Run the tests
    silent: true
    cmds:
      - go test ./...

  changie:
    desc: Run the pinned changie, e.g. task changie -- new
    silent: true
    cmds:
      - go run {{.CHANGIE}} {{.CLI_ARGS}}

  changelog:check:
    desc: Fail if a fragment does not parse or CHANGELOG.md is not what .changes/ merges to
    silent: true
    cmds:
      - go run {{.CHANGIE}} batch patch --dry-run > /dev/null
      - go run {{.CHANGIE}} merge
      - |
        git diff --exit-code -- CHANGELOG.md || {
          echo "CHANGELOG.md is generated; run 'task changie -- merge' and commit the result."; exit 1
        }

  check:
    desc: Everything CI runs
    silent: true
    cmds:
      - task: clean
      - task: fmt:check
      - task: build
      - task: vet
      - task: test
      - task: shellcheck
      - task: changelog:check
