name: check

on: push

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: go-task/setup-task@v1
      - name: Format
        run: task fmt:check
      - name: Build
        run: task build
      - name: Vet
        run: task vet
      - name: Test
        run: task test

  # The single required status check; add every new job to needs.
  all-checks-passed:
    if: always()
    needs: [check]
    runs-on: ubuntu-latest
    steps:
      - name: Require every job to succeed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          for result in $RESULTS; do
            [ "$result" = success ] || { echo "a required job ended with: $result"; exit 1; }
          done
