name: ci

# Called, not triggered: check.yml runs it on every pull request and push to main,
# release.yml against the tagged commit.
on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-tools
      - name: Format
        run: task fmt:check
      - name: Build
        run: task build
      - name: Vet
        run: task vet
      - name: Test
        run: task test
      - name: Shellcheck
        run: task shellcheck
      - name: Changelog
        run: task changelog:check
