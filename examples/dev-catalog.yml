# Minimal catalog for trying the control plane locally with -insecure-dev-auth.
server:
  oidc_audience: dev
  allowed_org: cloudyhome

actions:
  host.uptime:
    description: Show how long this host has been up
    tool: command
    command: [/usr/bin/uptime, --pretty]
    timeout: 1m
    allow:
      - repository: cloudyhome/infra

  host.disk:
    description: Show free space on one mount point
    tool: command
    command: [/usr/bin/df, -h, "{{ .mount }}"]
    timeout: 1m
    params:
      mount: { type: enum, values: [/, /tmp], default: / }
    allow:
      - repository: cloudyhome/infra
        environment: production
