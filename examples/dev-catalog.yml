# Minimal catalog for trying the control plane locally with -insecure-dev-auth.
server:
  oidc_audience: dev
  allowed_org: cloudyhomelab

actions:
  host.uptime:
    description: Show how long this host has been up
    timeout: 1m
    steps:
      - [/usr/bin/uptime, --pretty]
    allow:
      - repository: cloudyhomelab/infra

  host.disk:
    description: Show free space on one mount point
    timeout: 1m
    params:
      mount: { type: enum, values: [/, /tmp], default: / }
    steps:
      - [/usr/bin/df, -h, "{{ .mount }}"]
    allow:
      - repository: cloudyhomelab/infra
        environment: production
