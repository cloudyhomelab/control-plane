server:
  oidc_audience: controlplane_cloudyhome
  allowed_org: cloudyhomelab
  max_concurrent_jobs: 4

repos:
  homelab_public:
    url: https://github.com/cloudyhomelab/homelab.git
  homelab_private:
    url: git@github.com:cloudyhomelab/homelab.git
    deploy_key_file: /etc/controlplane/keys/homelab
    known_hosts_file: /etc/controlplane/known_hosts

env_profiles:
  homelab:
    pass_through: [TF_VAR_infisical_project_id, TF_VAR_infisical_environment]
    secrets: [TF_VAR_infisical_client_id, TF_VAR_infisical_client_secret]
    set:
      TF_IN_AUTOMATION: "1"
      CHECKPOINT_DISABLE: "1"

actions:
  homelab.plan:
    description: terraform plan in a given directory of cloudyhomelab/homelab
    repo: homelab_public
    env_profile: homelab
    allowed_refs: ["refs/pull/*/merge", "refs/heads/main"]
    require_ref_match: true
    lock: homelab-terraform
    timeout: 30m
    params:
      dir: { type: directory }
    steps:
      - [/usr/local/bin/terraform, "-chdir={{ .dir }}", init, -input=false, -no-color]
      - [/usr/local/bin/terraform, "-chdir={{ .dir }}", plan, -input=false, -no-color, "-out={{ .job_dir }}/tfplan"]
    allow:
      - repository: cloudyhomelab/homelab
        event_name: [pull_request, push]

  homelab.apply:
    description: terraform apply of a homelab.plan made on main
    input_from: homelab.plan
    allowed_refs: ["refs/heads/main"]
    require_ref_match: true
    timeout: 30m
    steps:
      - [/usr/local/bin/terraform, "-chdir={{ .dir }}", init, -input=false, -no-color]
      - [/usr/local/bin/terraform, "-chdir={{ .dir }}", apply, -input=false, -no-color, "{{ .input_dir }}/tfplan"]
    approvers: [binarycodes]
    allow:
      - repository: cloudyhomelab/homelab
        ref: refs/heads/main
        environment: production
