server:
  oidc_audience: https://controlplane.example.com
  allowed_org: cloudyhome
  max_concurrent_jobs: 4
  admins:
    - repository: cloudyhome/infra
      job_workflow_ref: "cloudyhome/infra/.github/workflows/admin.yml@refs/heads/main"

repos:
  infra:
    url: git@github.com:cloudyhome/infra.git
    deploy_key_file: /etc/controlplane/keys/infra
    known_hosts_file: /etc/controlplane/known_hosts

env_profiles:
  aws-prod:
    pass_through: [AWS_REGION, AWS_CONFIG_FILE]
    secrets: [AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY]
    set:
      TF_IN_AUTOMATION: "1"
      CHECKPOINT_DISABLE: "1"

actions:
  network.plan:
    description: Plan the shared network stack
    repo: infra
    dir: terraform/network
    env_profile: aws-prod
    allowed_refs: ["refs/heads/*", "refs/pull/*/merge"]
    lock: tf-network
    timeout: 30m
    params:
      region: { type: enum, values: [eu-west-1, us-east-1] }
    steps:
      - [/usr/local/bin/terraform, init, -input=false, -no-color]
      - [/usr/local/bin/terraform, plan, -input=false, -no-color,
         "-out={{ .job_dir }}/tfplan", "-var=region={{ .region }}"]
    allow:
      - repository: cloudyhome/infra
        event_name: [pull_request, push, workflow_dispatch]

  # Reads the saved plan from a network.plan job and applies exactly that.
  # Repo, dir, env_profile and lock come from network.plan; the job runs at the plan's commit.
  network.apply:
    description: Apply a reviewed network.plan
    input_from: network.plan
    allowed_refs: ["refs/heads/main"]
    require_ref_match: true
    steps:
      - [/usr/local/bin/terraform, init, -input=false, -no-color]
      - [/usr/local/bin/terraform, apply, -input=false, -no-color, "{{ .input_dir }}/tfplan"]
    allow:
      - repository: cloudyhome/infra
        ref: refs/heads/main
        environment: production

  base-image.build:
    description: Build the base VM image
    repo: infra
    dir: packer/base
    env_profile: aws-prod
    allowed_refs: ["refs/heads/main", "refs/tags/*"]
    lock: packer-base
    timeout: 90m
    params:
      version: { type: string, pattern: '[0-9]+\.[0-9]+\.[0-9]+' }
    steps:
      - [/usr/local/bin/packer, init, .]
      - [/usr/local/bin/packer, build, -color=false, -timestamp-ui, "-var=version={{ .version }}", .]
    allow:
      - repository: cloudyhome/images

  web.deploy:
    description: Run the site playbook against one host group
    repo: infra
    dir: ansible
    allowed_refs: ["refs/heads/main"]
    lock: ansible-prod
    params:
      limit: { type: enum, values: [web, api] }
      app_version: { type: string, pattern: '[0-9a-f]{7,40}' }
    # Extra vars as inline JSON: `-e key=value` would split a value on spaces into more vars.
    # --flag=value keeps a value starting with "-" from being read as an option.
    steps:
      - [/usr/bin/ansible-playbook, -i, inventories/prod, "--limit={{ .limit }}",
         '--extra-vars={"app_version": "{{ .app_version }}"}', site.yml]
    allow:
      - repository: cloudyhome/app
        environment: production

  host.uptime:
    description: Show how long the control plane host has been up
    timeout: 1m
    steps:
      - [/usr/bin/uptime, --pretty]
    allow:
      - repository: cloudyhome/infra
