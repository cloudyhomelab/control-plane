server:
  oidc_audience: https://controlplane.example.com
  allowed_org: cloudyhome
  max_concurrent_jobs: 4
  admins:
    - repository: cloudyhome/infra
      job_workflow_ref: "cloudyhome/infra/.github/workflows/admin.yml@refs/heads/main"

repos:
  # Public repo: plain HTTPS, no credentials. TLS verifies github.com.
  homelab_public:
    url: https://github.com/cloudyhome/homelab.git
  # Private repo: SSH with a read-only deploy key added to that one repo.
  homelab_private:
    url: git@github.com:cloudyhome/homelab.git
    deploy_key_file: /etc/controlplane/keys/homelab
    known_hosts_file: /etc/controlplane/known_hosts

env_profiles:
  homelab:
    pass_through: [TF_VAR_infisical_project_id, TF_VAR_infisical_environment]
    secrets: [TF_VAR_infisical_client_id, TF_VAR_infisical_client_secret]
    set:
      TF_IN_AUTOMATION: "1"
      CHECKPOINT_DISABLE: "1"

actions:
  homelab.plan:
    description: terraform plan in a given directory of cloudyhome/homelab
    repo: homelab_public
    env_profile: homelab
    allowed_refs: ["refs/pull/*/merge", "refs/heads/main"]
    require_ref_match: true
    lock: homelab-terraform
    timeout: 30m
    params:
      dir: { type: string, pattern: '[A-Za-z0-9_][A-Za-z0-9_-]*(/[A-Za-z0-9_][A-Za-z0-9_-]*)*' }
    steps:
      - [/usr/local/bin/terraform, "-chdir={{ .dir }}", init, -input=false, -no-color]
      - [/usr/local/bin/terraform, "-chdir={{ .dir }}", plan, -input=false, -no-color, "-out={{ .job_dir }}/tfplan"]
    allow:
      - repository: cloudyhome/homelab
        event_name: [pull_request, push]

  homelab.apply:
    description: terraform apply of a homelab.plan made on main
    input_from: homelab.plan
    allowed_refs: ["refs/heads/main"]
    require_ref_match: true
    timeout: 30m
    steps:
      - [/usr/local/bin/terraform, "-chdir={{ .dir }}", init, -input=false, -no-color]
      - [/usr/local/bin/terraform, "-chdir={{ .dir }}", apply, -input=false, -no-color, "{{ .input_dir }}/tfplan"]
    approvers: [binarycodes]
    allow:
      - repository: cloudyhome/homelab
        ref: refs/heads/main
        environment: production
